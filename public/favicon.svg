<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0F0C1B"/>
      <stop offset="100%" stop-color="#05030A"/>
    </radialGradient>
    <!-- Purple/Blue Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" /> <!-- magenta/purple -->
      <stop offset="50%" stop-color="#8B5CF6" /> <!-- violet/purple -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- blue -->
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Logo Group -->
  <g transform="translate(10, 10)" filter="url(#dropShadow)">
    <!-- Speed Lines on Left -->
    <path d="M 100 170 H 150" stroke="url(#logoGrad)" stroke-width="15" stroke-linecap="round" />
    <path d="M 70 200 H 150" stroke="url(#logoGrad)" stroke-width="18" stroke-linecap="round" />
    <path d="M 95 230 H 145" stroke="url(#logoGrad)" stroke-width="15" stroke-linecap="round" />
    <path d="M 115 260 H 160" stroke="url(#logoGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    <circle cx="75" cy="230" r="9" fill="url(#logoGrad)" />

    <!-- Magnifying Glass Handle -->
    <path d="M 338 298 L 415 375" stroke="url(#logoGrad)" stroke-width="32" stroke-linecap="round" />

    <!-- Magnifying Glass Outer Ring -->
    <circle cx="260" cy="220" r="110" fill="none" stroke="url(#logoGrad)" stroke-width="20" />

    <!-- Rising Bars inside Glass -->
    <!-- Bar 1 (Left) -->
    <rect x="205" y="230" width="28" height="60" rx="8" fill="url(#barGrad)" />
    <!-- Bar 2 (Middle) -->
    <rect x="245" y="195" width="28" height="95" rx="8" fill="url(#barGrad)" />
    <!-- Bar 3 (Right) -->
    <rect x="285" y="160" width="28" height="130" rx="8" fill="url(#barGrad)" />

    <!-- Trend Arrow Line -->
    <path d="M 190 230 L 250 170 L 280 185 L 340 125" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrow Head -->
    <path d="M 310 125 H 340 V 155" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
